default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: full-check
        name: full check suite
        entry: uv run python -m scripts.check
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        require_serial: true
